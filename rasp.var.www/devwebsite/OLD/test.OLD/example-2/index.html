<!DOCTYPE html>
<html>
<head>
	<title>Listen to Database Update</title>
</head>
<body>

<p>Run update-other-table.php in your browser now with any "content" GET parameter.</p>


<script type="text/javascript">
	
	function poll() {
		var ajax = new XMLHttpRequest();
		ajax.onreadystatechange = function() {
			if (this.readyState === 4 && this.status === 200) {
				if (this.status === 200) {
					try {
						var json = JSON.parse(this.responseText);
					} catch {
						poll();return;
					}
					

					if (json.status !== true) {
						alert(json.error);return;
					}

					var data = json.data;
					for (var i = 0, len = data.length; i < len; i++) {
						var x = data[i];

						var div = document.createElement("DIV");
						document.body.appendChild(div);
						div.innerHTML = 'time: ' + x.time + ', content: ' + x.content;
						
					}

					


					poll();
				} else {
					poll();
				}

			}
		}
		ajax.open('GET', 'long-polling.php', true);
		ajax.send();


	}
	
	poll();

</script>

</body>
</html>
